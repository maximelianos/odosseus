# Fold F1 with the tuning lap swapped (D-022): L2 (the off-line lap) is the tuning lap and in no map,
# L5 moves into the map. Validation laps unchanged (L1 + L6). Parameters unchanged from iter1.yaml
# (not re-tuned), so the tuning lap is only scored for information.
extends: iter1.yaml
results: results/cv/f1_swapped

split:
  train: [L0, L3, L4, L5, L7, L8]
  tune: [L2]
  val: [L1, L6]

reloc:
  map_name: map_cv_f1_swapped
