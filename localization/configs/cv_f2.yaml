# Cross-validation fold F2 (D-021): warm-up lap with a standstill + the other 40 m/s flying lap.
# L0 and L8 (both pit passes) are in every fold's map, L5 stays the tuning lap and is in no map.
# Method and parameters are unchanged from iter1.yaml.
extends: iter1.yaml
results: results/cv/f2

split:
  train: [L0, L1, L3, L4, L6, L8]
  tune: [L5]
  val: [L2, L7]

reloc:
  map_name: map_cv_f2
