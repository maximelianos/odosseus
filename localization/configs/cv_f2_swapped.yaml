# Fold F2 with the tuning lap swapped (D-022): L2 is the tuning lap, L5 becomes a validation lap.
# The map laps are exactly those of F2, so the map of F2 is reused (no rebuild). Parameters
# unchanged from iter1.yaml; note they were tuned on L5 (D-015), so L5's validation score here is
# optimistic by that tuning.
extends: iter1.yaml
results: results/cv/f2_swapped

split:
  train: [L0, L1, L3, L4, L6, L8]
  tune: [L2]
  val: [L5, L7]

reloc:
  map_name: map_cv_f2
